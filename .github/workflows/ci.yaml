name: ci

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # required to list changed charts

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: setup helm
        uses: azure/setup-helm@v5

      - name: install pre-commit
        run: sudo apt update && sudo apt install pre-commit -y

      - name: install chart testing
        uses: helm/chart-testing-action@v2

      - name: install just
        uses: taiki-e/install-action@just

      - name: install kubeconform
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          install-only: true # to prevent running golangci-lint twice

      - name: install shellcheck
        uses: taiki-e/install-action@shellcheck

      - name: lint
        env:
          LINT_FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }} # fallback of origin/main used for testing
          LINT_TO_REF: ${{ github.sha }}
        run: just lint
