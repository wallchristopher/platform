kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: platform

nodes:
  - role: control-plane
    labels:
      critical: "true"
      ingress-ready: "true"
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints:
            - key: critical
              value: "true"
              effect: NoSchedule
  - role: worker
    labels:
      tier: external
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        protocol: TCP
      - containerPort: 443
        hostPort: 4443
        protocol: TCP
  - role: worker
    labels:
      tier: internal
  - role: worker
    labels:
      tier: internal
