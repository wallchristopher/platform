argo-cd:
  configs:
    params:
      server.insecure: true

  server:
    httproute:
      enabled: true
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: envoy-gateway
          namespace: envoy-gateway-system
          sectionName: http
      hostnames:
        - argocd.platform.localhost
        # Floci rewrites the upstream Host header to its EKS target hostname.
        - floci-eks-platform
