{{- if .Values.localCredentials.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "localCredentials.name is required" .Values.localCredentials.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "platform-external-secrets.labels" . | nindent 4 }}
type: Opaque
stringData:
  access-key-id: {{ required "localCredentials.accessKeyID is required" .Values.localCredentials.accessKeyID | quote }}
  secret-access-key: {{ required "localCredentials.secretAccessKey is required" .Values.localCredentials.secretAccessKey | quote }}
{{- end }}
