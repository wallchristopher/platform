{{- $readiness := .Values.public.readiness -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "gateway.fullname" . }}-readiness
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.public.gateway.name | quote }}
      sectionName: {{ $readiness.listenerName | quote }}
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ $readiness.path | quote }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ include "gateway.fullname" . }}-readiness
          port: {{ $readiness.service.port }}
          weight: 1
