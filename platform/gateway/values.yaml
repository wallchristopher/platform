controller:
  # -- Controller Configuration
  config:
    # -- EnvoyGateway configuration.
    # Visit https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway to view all options.
    envoyGateway:
      gateway:
        # -- Name of the controller to use. This is currently the default but is referenced by our gatewayclass template.
        controllerName: gateway.envoyproxy.io/gatewayclass-controller

public:
  # -- envoyProxy configures the generated Envoy data plane.
  envoyProxy:
    # -- name is the namespaced EnvoyProxy referenced by the Gateway.
    name: envoy-gateway

    # -- service configures the generated Envoy Service.
    service:
      # -- type publishes Envoy through a fixed Kubernetes NodePort.
      type: NodePort

      # -- http configures the public HTTP Service port.
      http:
        # -- port is the Envoy Service port matched by the strategic merge patch.
        port: 80

        # -- nodePort is the stable port reached from the EKS network.
        nodePort: 30080

  # -- gateway class configuration
  gatewayClass:
    # -- gateway class name
    name: public
    # -- gateway class description
    description: Public gateway class for the platform

  # -- gateway configuration
  gateway:
    # -- gateway name
    name: envoy-gateway

    # -- listeners configuration
    listeners:
      # TODO: Add TLS configuration
      # https:
      #   protocol: HTTPS
      #   port: 443
      #   tls: REQUIRED
      #   allowedRoutes:
      #     kind: HTTPRoute
      #     namespace: All
      http:
        protocol: HTTP
        port: 80
        allowedRoutes:
          kinds:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
          namespaces:
            from: All
