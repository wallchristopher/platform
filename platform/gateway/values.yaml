controller:
  # -- Controller Configuration
  config:
    # -- EnvoyGateway configuration.
    # Visit https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway to view all options.
    envoyGateway:
      gateway:
        # -- Name of the controller to use. This is currently the default but is referenced by our gatewayclass template.
        controllerName: gateway.envoyproxy.io/gatewayclass-controller

public:
  # -- envoyProxy configures the generated Envoy data plane.
  envoyProxy:
    # -- name is the namespaced EnvoyProxy referenced by the Gateway.
    name: envoy-gateway

    # -- service configures the generated Envoy Service.
    service:
      # -- type publishes Envoy through a fixed Kubernetes NodePort.
      type: NodePort

      # -- http configures the public HTTP Service port.
      http:
        # -- port is the Envoy Service port matched by the strategic merge patch.
        port: 80

        # -- nodePort is the stable port reached from the EKS network.
        nodePort: 30080

  # -- gateway class configuration
  gatewayClass:
    # -- gateway class name
    name: public
    # -- gateway class description
    description: Public gateway class for the platform

  # -- gateway configuration
  gateway:
    # -- gateway name
    name: envoy-gateway

    # -- listeners configuration
    listeners:
      # TODO: Add TLS configuration
      # https:
      #   protocol: HTTPS
      #   port: 443
      #   tls: REQUIRED
      #   allowedRoutes:
      #     kind: HTTPRoute
      #     namespace: All
      http:
        protocol: HTTP
        port: 80
        allowedRoutes:
          kinds:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
          namespaces:
            from: All

  # -- readiness configures the gateway-owned NLB health endpoint.
  readiness:
    # -- listenerName is the Gateway listener that accepts readiness requests.
    listenerName: http

    # -- path is the exact HTTPRoute path used by the NLB health check.
    path: /ready

    # -- service exposes the Envoy proxy readiness port inside the cluster.
    service:
      # -- portName is the Service port name.
      portName: readiness

      # -- port is the Service port forwarded to Envoy readiness.
      port: 19003

      # -- targetPort is the named Envoy container readiness port.
      targetPort: readiness

      # -- selectorLabels identify Envoy Gateway proxy pods.
      selectorLabels:
        app.kubernetes.io/component: proxy
        app.kubernetes.io/managed-by: envoy-gateway
        app.kubernetes.io/name: envoy
